<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Vinyl Crate app icon: a record on the iPhone OS 3 navigation-bar blue,
       with the glossy arc icons had in that era. iOS rounds the corners. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9b8cc"/>
      <stop offset=".5" stop-color="#7189a8"/>
      <stop offset="1" stop-color="#3e5577"/>
    </linearGradient>
    <radialGradient id="disc" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2b2b2b"/>
      <stop offset=".7" stop-color="#121212"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="label" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset=".5" stop-color="#f29a2e"/>
      <stop offset=".5" stop-color="#e6801a"/>
      <stop offset="1" stop-color="#c8620c"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <circle cx="512" cy="530" r="400" fill="url(#disc)"/>
  </g>
  <g fill="none" stroke="#fff">
    <circle cx="512" cy="530" r="372" stroke-opacity=".07" stroke-width="3"/>
    <circle cx="512" cy="530" r="336" stroke-opacity=".06" stroke-width="3"/>
    <circle cx="512" cy="530" r="300" stroke-opacity=".08" stroke-width="3"/>
    <circle cx="512" cy="530" r="262" stroke-opacity=".06" stroke-width="3"/>
    <circle cx="512" cy="530" r="226" stroke-opacity=".07" stroke-width="3"/>
    <circle cx="512" cy="530" r="190" stroke-opacity=".05" stroke-width="3"/>
  </g>
  <!-- Light catching the grooves -->
  <path d="M512 530 L250 230 A400 400 0 0 1 390 150 Z" fill="#fff" fill-opacity=".09"/>
  <path d="M512 530 L774 830 A400 400 0 0 1 634 910 Z" fill="#fff" fill-opacity=".07"/>

  <circle cx="512" cy="530" r="150" fill="url(#label)"/>
  <circle cx="512" cy="530" r="150" fill="none" stroke="#000" stroke-opacity=".25" stroke-width="4"/>
  <circle cx="512" cy="530" r="104" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="3"/>
  <circle cx="512" cy="530" r="16" fill="#1a1a1a"/>

  <!-- Classic iOS gloss -->
  <path d="M0 0 H1024 V430 C760 520 264 520 0 430 Z" fill="url(#gloss)"/>
</svg>
